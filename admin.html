<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ta Panda CRM — Projects Management</title>
  <link rel="stylesheet" href="admin.css">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Outfit:wght@300..700&family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Inter:ital,wght@0,300..600;1,300..600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="images/tapanda_favicon.png">
</head>
<body>
  
  <!-- Login Overlay -->
  <div id="loginOverlay" class="login-overlay">
    <div class="login-box">
      <h2>Ta Panda CRM</h2>
      <p>Enter password to access the project management panel.</p>
      <input type="password" id="loginPassword" placeholder="Password" />
      <button id="loginBtn">Login</button>
      <div id="loginError" class="error-text"></div>
    </div>
  </div>

  <!-- Main CRM Layout -->
  <div id="crmContainer" class="crm-container" style="display: none;">
    
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>Projects CRM</h2>
        <div style="display: flex; flex-direction: column; gap: 5px; align-items: flex-start;">
          <a href="index.html" class="back-link">← Back to Site</a>
          <button id="reloadBtn" class="btn-outline" style="padding: 4px 8px; font-size: 0.8rem; border-radius: 4px;">Reload from File</button>
          <span id="reloadStatus" style="font-size: 0.8rem; display: none;"></span>
        </div>
      </div>
      
      <div class="categories-list" id="categoriesList">
        <!-- Categories injected here -->
      </div>
      
      <div class="sidebar-footer">
        <div class="add-cat-form" id="addCatForm" style="display: none;">
          <input type="text" id="newCatName" placeholder="Category Name..." />
          <button id="saveNewCatBtn">Create</button>
          <button id="cancelNewCatBtn" class="btn-text">Cancel</button>
        </div>
        <button id="addCategoryBtn" class="btn-full">+ Add New Category</button>
        
        <div class="export-section">
          <p class="notice">Click Publish Changes to save your edits directly to the projects-data.json file on the server.</p>
          <button id="exportDataBtn" class="btn-outline">Publish Changes</button>
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content" id="mainContent" style="display: none;">
      <header class="content-header">
        <h1 id="currentCategoryName">Category Name</h1>

      </header>

      <div class="items-grid" id="itemsGrid">
        <!-- Items injected here -->
      </div>

      <div class="add-item-section">
        <button id="addItemBtn" class="btn-primary">+ Add Image</button>
      </div>
    </main>
    
    <!-- Empty State -->
    <main class="main-content empty-state" id="emptyState">
      <p>Select a category from the sidebar or create a new one.</p>
    </main>

  </div>

  <!-- Add Item Modal -->
  <div id="addItemModal" class="modal-overlay" style="display: none;">
    <div class="modal-box">
      <h3>Add New Item</h3>
      <input type="file" id="itemFileInput" accept="image/*,video/*" multiple />
      <div class="image-preview-container" id="imagePreviewContainer" style="display: none;">
        <img id="itemImagePreview" src="" alt="Preview">
      </div>
      
      <div id="multiFilePreviewContainer" style="display: none;">
        <div class="multi-preview-strip" id="multiPreviewStrip" style="display: flex; overflow-x: auto; gap: 10px; margin-bottom: 10px; max-height: 120px;"></div>
        <p id="multiFileStatus" style="font-size: 0.9rem; margin-bottom: 15px; color: #aaa;"></p>
      </div>
      
      <div id="singleFileFormGroup">
        <div class="form-group">
          <label>Title</label>
          <input type="text" id="newItemTitle" placeholder="e.g. Master Bedroom" />
        </div>
        
        <div class="form-group">
          <label>Subtitle</label>
          <input type="text" id="newItemSubtitle" placeholder="e.g. The Amber Retreat" />
        </div>
      </div>
      
      <div class="form-group">
        <label>Category</label>
        <select id="newItemCategory"></select>
      </div>
      
      <div class="modal-actions">
        <button id="saveItemBtn" class="btn-primary">Save to Gallery</button>
        <button id="cancelItemBtn" class="btn-text">Cancel</button>
      </div>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
